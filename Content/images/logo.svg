  <g transform="translate(8, 4)">
    <path d="M14 18 L42 18 L40 54 L16 54 Z" fill="#EFE8F7" stroke="#7B6BA8" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M16 20 L40 20 L39 36 L17 36 Z" fill="#FFFFFF" stroke="#7B6BA8" stroke-width="0.8" opacity="0.9"/>
    <line x1="28" y1="20" x2="28" y2="9" stroke="#7B6BA8" stroke-width="1.2"/>
    <!-- Flame — soft amber to look like real flame -->
    <path d="M28 4 C 24 9, 24 14, 28 16 C 32 14, 32 9, 28 4 Z" fill="#E0A75E" opacity="0.95"/>
    <path d="M28 8 C 26 10, 26 12, 28 13 C 30 12, 30 10, 28 8 Z" fill="#F5D8A8"/>
